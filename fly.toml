# fly.toml app configuration file generated for invoicetrucker on 2026-08-10T06:51:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'invoicetrucker'
primary_region = 'fra'

[build]
  dockerfile = 'apps/api/FleetForge.Api/Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_HTTP_PORTS = '8080'
  Database__ApplyMigrations = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
