name: invoicetrucker

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicetrucker}
      POSTGRES_USER: ${POSTGRES_USER:-invoicetrucker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoicetrucker_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoicetrucker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/FleetForge.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FleetForge: Host=postgres;Port=5432;Database=${POSTGRES_DB:-invoicetrucker};Username=${POSTGRES_USER:-invoicetrucker};Password=${POSTGRES_PASSWORD:-invoicetrucker_dev}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Database__ApplyMigrations: "true"
    ports:
      - "${API_PORT:-5050}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5050}
        NEXT_PUBLIC_PRODUCT_URL: ${NEXT_PUBLIC_PRODUCT_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  invoicetrucker-postgres-data:
